name: Fuzz Tests

defaults:
    run:
        shell: bash

permissions:
    contents: read

on:
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:

env:
    GO_VERSION: "1.26.8"

jobs:
    fuzz:
        name: Fuzz ${{ matrix.target }}
        runs-on: hiero-client-sdk-linux-medium
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                # go test -fuzz runs exactly one target at a time
                target:
                    - FuzzRLPItemRead
                    - FuzzABIDecode

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Set up Go ${{ env.GO_VERSION }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ env.GO_VERSION }}

            - name: Check out code into the Go module directory
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Locate Fuzz Corpus
              id: corpus
              run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

            # Continue from the inputs found by the previous run instead of starting over from the seeds
            - name: Cache Fuzz Corpus
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.corpus.outputs.dir }}
                  key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
                  restore-keys: fuzz-corpus-${{ matrix.target }}-

            - name: Fuzz ${{ matrix.target }}
              env:
                  FUZZ_TARGET: ${{ matrix.target }}
              run: go test ./sdk -tags="unit" -run '^$' -fuzz "^${FUZZ_TARGET}\$" -fuzztime=5m

            - name: Upload Failing Input
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: fuzz-failure-${{ matrix.target }}
                  path: sdk/testdata/fuzz/
