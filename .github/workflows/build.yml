name: PR Checks

defaults:
    run:
        shell: bash

permissions:
    contents: read

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
    GO_VERSION: "1.26.8"
    NODE_VERSION: "22"
    HIERO_VERSION: v0.73.0
    MIRROR_NODE_VERSION: v0.153.0
    SOLO_VERSION: v0.91.0
    HEDERA_NETWORK: localhost

jobs:
    build:
        name: Build
        runs-on: hiero-client-sdk-linux-medium
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                egress-policy: audit

            - name: Setup GCC
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends gcc libc6-dev libc-dev

            - name: Set up Go ${{ env.GO_VERSION }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ env.GO_VERSION }}
              id: go

            - name: Check out code into the Go module directory
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Tidy SDK Modules
              run: go mod tidy
              working-directory: ./

            - name: Lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  skip-cache: true
                  args: --timeout=5m

            - name: Build SDK and Examples
              run: go build -v ./...

    test:
        name: Unit and Integration Tests
        if: success()
        runs-on: hiero-client-sdk-linux-medium

        needs:
            - build

        strategy:
          matrix:
            test-type: [unit, e2e]

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Setup NodeJS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                node-version: ${{ env.NODE_VERSION }}

            - name: Setup GCC
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends gcc libc6-dev libc-dev

            - name: Set up Go ${{ env.GO_VERSION }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ env.GO_VERSION }}
              id: go

            - name: Check out code into the Go module directory
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Prepare Hiero Solo
              if: success() && matrix.test-type == 'e2e'
              id: solo
              uses: hiero-ledger/hiero-solo-action@c982fe02b37db2a25a6a5e61139d9fe5d0917cff # v0.26.0
              with:
                installMirrorNode: true
                hieroVersion: ${{ env.HIERO_VERSION }}
                mirrorNodeVersion: ${{ env.MIRROR_NODE_VERSION }}
                soloVersion: ${{ env.SOLO_VERSION }}

            - name: Set Operator Account
              if: success() && matrix.test-type == 'e2e'
              run: |
                echo "OPERATOR_KEY=${{ steps.solo.outputs.ed25519PrivateKey }}" >> $GITHUB_ENV
                echo "OPERATOR_ID=${{ steps.solo.outputs.ed25519AccountId }}" >> $GITHUB_ENV

            - name: Tests Unit
              if: success() && matrix.test-type == 'unit'
              run: go test ./sdk -tags="unit" -timeout 9999s -v -coverprofile=unit.out -covermode=atomic -race

            - name: Tests Integration
              if: success() && matrix.test-type == 'e2e'
              run: go test ./sdk -tags="e2e" -timeout 9999s -v -coverprofile=e2e.out -covermode=atomic -race

            - name: Upload unit test coverage to Codecov
              if: success() && matrix.test-type == 'unit'
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                files: ./unit.out

            - name: Upload e2e test coverage to Codecov
              if: success() && matrix.test-type == 'e2e'
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                files: ./e2e.out

    test-dab:
        name: DAB Tests
        if: success()
        runs-on: hiero-client-sdk-linux-medium

        needs:
            - build

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                egress-policy: audit

            - name: Setup NodeJS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                node-version: ${{ env.NODE_VERSION }}

            - name: Setup GCC
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends gcc libc6-dev libc-dev

            - name: Set up Go ${{ env.GO_VERSION }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ env.GO_VERSION }}
              id: go

            - name: Check out code into the Go module directory
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Prepare Hiero Solo
              id: solo
              uses: hiero-ledger/hiero-solo-action@c982fe02b37db2a25a6a5e61139d9fe5d0917cff # v0.26.0
              with:
                installMirrorNode: true
                hieroVersion: ${{ env.HIERO_VERSION }}
                mirrorNodeVersion: ${{ env.MIRROR_NODE_VERSION }}
                soloVersion: ${{ env.SOLO_VERSION }}
                dualMode: true

            - name: Set Operator Account
              run: |
                echo "OPERATOR_KEY=${{ steps.solo.outputs.ed25519PrivateKey }}" >> $GITHUB_ENV
                echo "OPERATOR_ID=${{ steps.solo.outputs.ed25519AccountId }}" >> $GITHUB_ENV

            - name: Tests DAB
              run: go test ./sdk -tags="dab" -timeout 9999s -v -coverprofile=dab.out -covermode=atomic -race

            - name: Upload dab test coverage to Codecov
              if: success()
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                token: ${{ secrets.CODECOV_TOKEN }}
                files: ./dab.out

    run-examples:
        name: Run Examples
        if: success()
        runs-on: hiero-client-sdk-linux-medium

        needs:
            - build

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Setup NodeJS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                node-version: ${{ env.NODE_VERSION }}

            - name: Setup GCC
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends gcc libc6-dev libc-dev

            - name: Set up Go ${{ env.GO_VERSION }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ env.GO_VERSION }}
              id: go

            - name: Check out code into the Go module directory
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Task
              run: go install github.com/go-task/task/v3/cmd/task@v3.17.0

            - name: Prepare Hiero Solo
              id: solo
              uses: hiero-ledger/hiero-solo-action@c982fe02b37db2a25a6a5e61139d9fe5d0917cff # v0.26.0
              with:
                installMirrorNode: true
                hieroVersion: ${{ env.HIERO_VERSION }}
                mirrorNodeVersion: ${{ env.MIRROR_NODE_VERSION }}
                soloVersion: ${{ env.SOLO_VERSION }}

            - name: Set Operator Account
              run: |
                echo "OPERATOR_KEY=${{ steps.solo.outputs.ed25519PrivateKey }}" >> $GITHUB_ENV
                echo "OPERATOR_ID=${{ steps.solo.outputs.ed25519AccountId }}" >> $GITHUB_ENV

            - name: Run Examples
              if: success()
              run: task run-examples

    build-test-tck:
        name: Build and Test TCK
        runs-on: hiero-client-sdk-linux-medium
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                egress-policy: audit

            - name: Setup GCC
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends gcc libc6-dev libc-dev

            - name: Set up Go ${{ env.GO_VERSION }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ env.GO_VERSION }}
              id: go

            - name: Check out code into the Go module directory
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Tidy TCK Modules
              run: go mod tidy
              working-directory: ./tck

            - name: Build TCK
              run: go build -v ./...
              working-directory: ./tck 

            - name: Lint TCK
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  skip-cache: true
                  args: --timeout=5m   
                  working-directory: ./tck 

    tck-compatibility:
        name: TCK Compatibility
        runs-on: hiero-client-sdk-linux-medium
        needs:
            - build
            - test
        timeout-minutes: 45
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                egress-policy: audit

            - name: Setup GCC
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends gcc libc6-dev libc-dev

            - name: Set up Go ${{ env.GO_VERSION }}
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ env.GO_VERSION }}
              id: go

            - name: Check out code into the Go module directory
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # A built binary instead of go run, so the saved pid is the server's own.
            - name: Build and start the TCK server
              id: tck-server
              working-directory: ./tck
              run: |
                go mod tidy
                go build -o "${RUNNER_TEMP}/tck-server" ./cmd
                nohup "${RUNNER_TEMP}/tck-server" > "${RUNNER_TEMP}/tck-server.log" 2>&1 &
                echo "pid=$!" >> "${GITHUB_OUTPUT}"

            - name: Prepare Hiero Solo
              uses: hiero-ledger/hiero-solo-action@c982fe02b37db2a25a6a5e61139d9fe5d0917cff # v0.26.0
              with:
                installMirrorNode: true
                hieroVersion: ${{ env.HIERO_VERSION }}
                mirrorNodeVersion: ${{ env.MIRROR_NODE_VERSION }}
                soloVersion: ${{ env.SOLO_VERSION }}

            # Pinned to the commit of a TCK release tag. Bump it on purpose with the next TCK release.
            - name: Run the TCK
              timeout-minutes: 20
              uses: hiero-ledger/hiero-sdk-tck@c9e7169888d86be4793cde5932ce57d9450a9761 # v0.14.0
              with:
                  node-ip: 127.0.0.1:35211
                  mirror-node-rest-url: http://127.0.0.1:38081
                  artifact-name: tck-compatibility

            - name: Show the TCK server log
              if: failure()
              run: cat "${RUNNER_TEMP}/tck-server.log" || true

            - name: Upload the TCK server log
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: tck-compatibility-logs
                  path: ${{ runner.temp }}/tck-server.log
                  if-no-files-found: ignore

            - name: Stop the TCK server
              if: always()
              run: kill "${{ steps.tck-server.outputs.pid }}" 2>/dev/null || true
