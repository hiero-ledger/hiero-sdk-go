version: "2"
linters:
    default: none
    enable:
        - bodyclose
        - dogsled
        - errcheck
        - gochecknoinits
        - goconst
        - gocritic
        - gocyclo
        - gosec
        - govet
        - ineffassign
        - nakedret
        - staticcheck
        - unconvert
        - unparam
        - unused
    settings:
        gosec:
            excludes:
                - G115
        staticcheck:
            checks:
                - "all"
                - "-ST1003" # Poorly chosen identifier.
                - "-QF1008" # Omit embedded fields from selector expression.
    exclusions:
        generated: lax
        rules:
            # The SDK must keep reading protobuf fields HAPI marks deprecated.
            - linters:
                  - staticcheck
              text: "SA1019: .*is deprecated: Marked as deprecated in .*\\.proto"
        presets:
            - comments
            - common-false-positives
            - legacy
            - std-error-handling
        paths:
            - third_party$
            - builtin$
            - examples$